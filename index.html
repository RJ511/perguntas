<!DOCTYPE html>
<html lang="pt">
   <!-- Sai daqui danielll-->
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nazaré — Quinta-feira</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="floating floating-1">🏄</div>
    <div class="floating floating-2">🗿</div>
    <div class="floating floating-3">🦀</div>
    <div class="floating floating-4">🌴</div>

    <main>

        <section class="hero">

            <div class="badge">
                🌊 QUINTA-FEIRA 🌊
            </div>

            <h1>
                Quem é que vai à
                <span>Nazaré</span>
                esta quinta?
            </h1>

            <p class="subtitle">
                Vá lá. Não sejam conas.
            </p>

            <button id="openForm" class="main-button">
                EU VOU 🚗
            </button>

        </section>


        <!-- Lista -->
        <section class="participants-section">

            <h2>
                Quem vai?
                <span id="count">0</span>
            </h2>

            <div id="participants" class="participants">
                <div class="loading">
                    A carregar...
                </div>
            </div>

        </section>

    </main>

    <div id="modal" class="modal hidden">

        <div class="modal-content">

            <button id="closeForm" class="close">
                ×
            </button>

            <h2>Vais mesmo? 👀</h2>

            <p>Então mete aí o nome.</p>

            <form id="participantForm">

                <input
                    id="name"
                    type="text"
                    placeholder="O teu nome..."
                    maxlength="30"
                    required
                    autocomplete="off"
                >

                <p class="emoji-title">
                    Escolhe a tua vibe
                </p>

                <div class="emoji-picker">

                    <button type="button" class="emoji selected">
                        🗿
                    </button>

                    <button type="button" class="emoji">
                        🏄
                    </button>

                    <button type="button" class="emoji">
                        🦀
                    </button>

                    <button type="button" class="emoji">
                        🐸
                    </button>

                    <button type="button" class="emoji">
                        💀
                    </button>

                    <button type="button" class="emoji">
                        🌴
                    </button>

                    <button type="button" class="emoji">
                        🦈
                    </button>

                    <button type="button" class="emoji">
                        🔥
                    </button>

                </div>

                <button
                    type="submit"
                    class="submit-button"
                >
                    ENTRAR NA LISTA
                </button>

                <p id="error" class="error"></p>

            </form>

        </div>

    </div>

    <div id="confetti"></div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
